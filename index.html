<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>

<body>
    <div id="main-container">
        <div id="timer-display">*</div>
        <video autoplay="true" id="live-cam"></video>
        <button id="snap" onClick="goButton()">Snap Photo</button>
    </div>

    <div id="picture-container">
        <button id="save" onClick="saveImage()">Save</button>
        <canvas id="canvas" width ="210" height ="1500"></canvas>
    </div>

    <script>
        const video = document.getElementById("live-cam")
        const canvas = document.getElementById("canvas")
        const context = canvas.getContext("2d")

        if (navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(function (stream) {
                video.srcObject = stream;
                })
                .catch(function (err0r) {
                console.log("Something went wrong!");
                });
            }
        
        function goButton() {
            takePicture(0)
            let i = 1;
            var picTimer = setInterval(function() {
                if (i >= 4) {
                    clearInterval(picTimer);
                } else
                    takePicture(i++);
            }, 5000);
        }
        
        function takePicture(location) {
            var yCor = location * 160
            var timeLeft = 3;
            var snapTimer = setInterval(function() {
                if (timeLeft <= 0) {
                    clearInterval(snapTimer);
                    document.getElementById("timer-display").textContent = "*";
                    context.drawImage(video, 0, yCor, 200, 150)
                } else 
                    document.getElementById("timer-display").textContent = timeLeft--;
                }, 1000);
        }

        function saveImage() {
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob)
                const link = document.createElement('a');
                link.href = url;
                link.download = 'canvas-image.png';
                link.click();
                URL.revokeObjectURL(url);
            }, 'image/png');
        }

    </script>
</body>
