<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/index.css">
    <title>Photobooth</title>
</head>

<body>
    <div id="timer-display">*</div>
    <!-- <div id="first-stage-box"> -->
        <div id="outer-box">
            <div id="test-box">
                <video id="live-cam" autoplay="true" class="grayscale-filter"></video>
                <canvas id="current-picture" width="360" height="240" class="grayscale-filter"></canvas>
            </div>
        </div>
        <div id="button-container">
            <button id="snap" onClick="takePicture()">Capture</button>
            <div id="color-mode">
                <button id="gray-button" class="selected-button" onClick="grayscaleMode()">B&W</button>
                <button id="color-button" onClick="colorMode()">Color</button>
            </div>
        </div>
    <!-- </div> -->
    <div id="second-stage">
        <canvas id="photostrip" width="440" height="1250"></canvas>
        <input id="input-box"></input>
    </div>
    <script src="main.js"></script>
</body>
